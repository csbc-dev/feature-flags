<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>feature-flags · @wcstack/state</title>

    <!--
      Import map. Resolves the bare specifiers used by the inline module below
      AND by the served Shell:
        - @csbc-dev/feature-flags → the BUILT package, served at /_pkg/ by the
          shared server (this example is buildless, so it consumes the compiled
          Shell rather than the TS source).
        - @wc-bindable/* → pinned to the version the package was built against
          (0.4.0) so the served Shell's `bind()` and <demo-session>'s proxy
          share ONE module instance. Bump these together with the package's
          dependency when it changes.
    -->
    <script type="importmap">
      {
        "imports": {
          "@csbc-dev/feature-flags": "/_pkg/index.js",
          "@wc-bindable/core": "https://esm.run/@wc-bindable/core@0.4.0",
          "@wc-bindable/remote": "https://esm.run/@wc-bindable/remote@0.4.0"
        }
      }
    </script>

    <style>
      :root {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #1c2433;
        line-height: 1.5;
      }
      body { margin: 0; background: #f6f8fb; }
      main { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
      h1 { font-size: 1.4rem; }
      .hint { color: #5b6675; font-size: 0.9rem; }
      code { background: #eef1f6; padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.85em; }
      .status { display: flex; gap: 1.25rem; flex-wrap: wrap; margin: 1rem 0; font-size: 0.9rem; }
      .status .err b { color: #c0392b; }
      .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
      button {
        border: 1px solid #c9d2e0; background: #fff; border-radius: 6px;
        padding: 0.45rem 0.8rem; cursor: pointer; font-size: 0.85rem;
      }
      button:hover { background: #eef3fb; }
      .callout { margin-top: 1rem; padding: 0.75rem 1rem; background: #e8f5ff; border: 1px solid #b9defc; border-radius: 8px; }
      .banner { margin-top: 1rem; padding: 0.75rem 1rem; background: #fff5e0; border: 1px solid #ffd98a; border-radius: 8px; }
    </style>

    <!--
      (1) Register <feature-flags> and <demo-session> BEFORE the @wcstack/state
          runtime scans the DOM. Module scripts run in document order, and
          customElements.define() upgrades already-parsed elements synchronously,
          so by the time <wcs-state> (registered by the /auto script below) scans
          `data-wcs`, both elements are upgraded and their `static wcBindable`
          (which the property + command bindings read) is available.
    -->
    <script type="module">
      import { bootstrapFlags } from "@csbc-dev/feature-flags";
      import {
        createRemoteCoreProxy,
        WebSocketClientTransport,
      } from "@wc-bindable/remote";

      // Same-origin socket — the shared server hosts the page AND the Core, so
      // the URL is derived, never hard-coded (see examples/CONVENTIONS.md §5).
      function flagsWsUrl() {
        const proto = location.protocol === "https:" ? "wss" : "ws";
        return `${proto}://${location.host}/ws`;
      }

      // FlagsCore bindable surface, needed to build the RemoteCoreProxy. MUST
      // stay identical to FlagsCore.wcBindable. (The package does not re-export
      // the declaration from its browser entry, so the proxy descriptor is
      // declared here.)
      const FLAGS_DECLARATION = {
        protocol: "wc-bindable",
        version: 1,
        properties: [
          { name: "flags", event: "feature-flags:flags-changed" },
          { name: "identified", event: "feature-flags:identified-changed" },
          { name: "loading", event: "feature-flags:loading-changed" },
          { name: "error", event: "feature-flags:error" },
        ],
        commands: [
          { name: "identify", async: true },
          { name: "reload", async: true },
        ],
      };

      // Minimal stand-in for <auth0-session>: <feature-flags> only needs a
      // target exposing `.proxy` / `.ready` that fires
      // `auth0-session:ready-changed`. That whole contract — without Auth0.
      class DemoSession extends HTMLElement {
        _proxy = null;
        _ready = false;
        _ws = null;
        get proxy() { return this._proxy; }
        get ready() { return this._ready; }
        connectedCallback() {
          this.style.display = "none";
          // Defer opening the socket until the page has fully loaded, so the
          // declarative <wcs-state> bindings are wired up BEFORE the first
          // server snapshot arrives. On a fast (localhost) connection the
          // server's one-shot `identified` push can otherwise be dispatched
          // before <wcs-state> has subscribed to this element — and unlike
          // `flags` (which the demo re-pushes every ~4s, so a missed first
          // push self-heals) a deduped one-shot value would then be missed for
          // good, leaving `identified` stuck at false. A real <auth0-session>
          // opens its socket only after auth completes, so it never races the
          // initial bind; this `load` gate reproduces that ordering for the demo.
          if (document.readyState === "complete") this._connect();
          else window.addEventListener("load", () => this._connect(), { once: true });
        }
        _connect() {
          if (this._ws) return;
          const ws = new WebSocket(this.getAttribute("url") || flagsWsUrl());
          this._ws = ws;
          this._proxy = createRemoteCoreProxy(FLAGS_DECLARATION, new WebSocketClientTransport(ws));
          ws.addEventListener("open", () => this._setReady(true));
          ws.addEventListener("close", () => this._setReady(false));
        }
        disconnectedCallback() {
          this._setReady(false);
          this._proxy?.dispose();
          this._ws?.close();
          this._proxy = null;
          this._ws = null;
        }
        _setReady(value) {
          if (this._ready === value) return;
          this._ready = value;
          this.dispatchEvent(new CustomEvent("auth0-session:ready-changed", { detail: value }));
        }
      }
      customElements.define("demo-session", DemoSession);

      // Register <feature-flags>.
      bootstrapFlags();
    </script>

    <!--
      (2) @wcstack/state runtime — a single, pinned, self-registering CDN import.
          The /auto entry registers <wcs-state> on load; there is no bootstrap
          call (the library's Rule 3: initial load = tag definitions only). Bump
          the pinned version when adopting a newer @wcstack/state and re-verify
          the binding names against packages/state/README.md.
    -->
    <script type="module" src="https://esm.run/@wcstack/state@1.10.4/auto"></script>
  </head>

  <body>
    <main>
      <h1>@csbc-dev/feature-flags — @wcstack/state</h1>
      <p class="hint">
        The <em>declarative</em> path. <code>&lt;feature-flags&gt;</code> publishes its
        bindable surface into the <code>&lt;wcs-state&gt;</code> store via
        <code>data-wcs</code>, and the rest of the page reads from that store —
        no per-flag JavaScript.
      </p>

      <!--
        State: the app-facing keys the page binds to, plus command channels.
        The DOM owns state here; <feature-flags> publishes INTO it. State is
        updated by path assignment only (`this["a.b"] = …`) — though this
        example never writes flags itself (the element does).
      -->
      <wcs-state>
        <script type="module">
          export default {
            // Populated from <feature-flags> (element output → state path).
            currentFlags: {},
            flagsReady: false,
            flagsLoading: false,
            flagsError: null,

            // Command channels routed to <feature-flags>'s commands. The
            // element subscribes via `command.identify: $command.identifyFlags`
            // below; emitting here invokes the element's method with the args.
            $commandTokens: ["identifyFlags", "reloadFlags"],
            // emit() returns the subscribers' results; <feature-flags>'s
            // identify()/reload() REJECT if clicked before the session proxy is
            // ready. Wrap in allSettled so that early click never becomes an
            // unhandled promise rejection (the vanilla/react/vue examples .catch
            // the same calls; this is the declarative equivalent).
            identifyAlice() { Promise.allSettled(this.$command.identifyFlags.emit("alice")); },
            identifyBob()   { Promise.allSettled(this.$command.identifyFlags.emit("bob")); },
            identifyGuest() { Promise.allSettled(this.$command.identifyFlags.emit("guest")); },
            reload()        { Promise.allSettled(this.$command.reloadFlags.emit()); },

            // Render "none" instead of an empty error.
            get errorMessage() {
              return this.flagsError ? (this.flagsError.message || String(this.flagsError)) : "none";
            },

            // Computed views over the schema-less flag map. These do the nested
            // access in plain JS on the WHOLE `currentFlags` object (one path
            // read) rather than binding a deep path like
            // `currentFlags.cta_text.value` directly — a deep path would make
            // @wcstack/state's resolver walk through `undefined` intermediates
            // on the first frame (before the first server snapshot, when
            // `currentFlags` is still `{}`) and throw. Reading the whole map
            // and guarding here keeps the first frame clean. Each getter
            // depends on `currentFlags`, so a new map reassignment recomputes it.
            get ctaText() {
              const f = this.currentFlags;
              return f && f.cta_text ? f.cta_text.value : "—";
            },
            get newCheckoutOn() {
              const f = this.currentFlags;
              return !!(f && f.new_checkout_flow && f.new_checkout_flow.enabled);
            },
            get darkModeOn() {
              const f = this.currentFlags;
              return !!(f && f.dark_mode && f.dark_mode.enabled);
            },
            get betaBannerOn() {
              const f = this.currentFlags;
              return !!(f && f.beta_banner && f.beta_banner.enabled);
            },
          };
        </script>
      </wcs-state>

      <!--
        Transport (stands in for <auth0-session>) + the Shell.

        The left-hand names are the element's bindable PROPERTIES /
        COMMANDS; the right-hand side are state paths / command tokens:
          - `flags: currentFlags`         → element output flows into the store
          - `command.identify: $command.identifyFlags`
                                          → store can invoke the element's method

        NOTE on initial state: <feature-flags> holds `flags = {}` (frozen) and
        bind() replays that EMPTY map immediately — before the first server
        snapshot. So deep paths like `currentFlags.cta_text.value` and
        `currentFlags.new_checkout_flow.enabled` resolve to UNDEFINED for the
        first frame(s). The declarative bindings below tolerate that (text
        renders blank, `if:` is falsy), so no per-flag guard is wired here.
      -->
      <demo-session id="flags-session"></demo-session>
      <feature-flags
        id="flags"
        target="flags-session"
        data-wcs="flags: currentFlags;
                  identified: flagsReady;
                  loading: flagsLoading;
                  error: flagsError;
                  command.identify: $command.identifyFlags;
                  command.reload: $command.reloadFlags">
      </feature-flags>

      <div class="status">
        <span>identified: <b data-wcs="textContent: flagsReady">…</b></span>
        <span>loading: <b data-wcs="textContent: flagsLoading">…</b></span>
        <span>cta_text: <b data-wcs="textContent: ctaText">…</b></span>
        <span class="err">error: <b data-wcs="textContent: errorMessage">…</b></span>
      </div>

      <!--
        Commands are invoked declaratively: each button calls a state method,
        which emits on a command token; the token invokes the element's command.
        No getElementById / imperative `.identify(...)` glue anywhere.
      -->
      <div class="controls">
        <button data-wcs="onclick: identifyAlice">identify("alice")</button>
        <button data-wcs="onclick: identifyBob">identify("bob")</button>
        <button data-wcs="onclick: identifyGuest">identify("guest")</button>
        <button data-wcs="onclick: reload">reload()</button>
      </div>

      <!-- Conditional rendering driven by a single flag, via `if:` on <template>.
           Bound to computed getters (see the state script) rather than deep flag
           paths, so the first frame (empty map) never walks through undefined. -->
      <template data-wcs="if: newCheckoutOn">
        <p class="callout">🎉 New checkout flow is enabled for this identity.</p>
      </template>

      <template data-wcs="if: darkModeOn">
        <p class="callout">🌙 Dark mode is enabled for this identity.</p>
      </template>

      <!-- beta_banner is flipped by the server every few seconds — a live push. -->
      <template data-wcs="if: betaBannerOn">
        <div class="banner">✨ Beta banner is live (toggled server-side).</div>
      </template>
    </main>
  </body>
</html>
